<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Obter Localização Exata</title>
</head>
<body>

    <h2>Buscar Minha Posição Exata</h2>
    <button onclick="buscarLocalizacao()">Obter Minha Localização</button>
    
    <p id="status"></p>
    <p id="coordenadas"></p>

    <script>
        function buscarLocalizacao() {
            const status = document.getElementById('status');
            const coordenadas = document.getElementById('coordenadas');

            // Limpa mensagens anteriores
            status.textContent = "Solicitando permissão...";
            coordenadas.textContent = "";

            // 1. Verifica se o navegador suporta a API
            if (!navigator.geolocation) {
                status.textContent = "A geolocalização não é suportada pelo seu navegador.";
                return;
            }

            // Configurações para forçar a máxima precisão (GPS)
            const opcoes = {
                enableHighAccuracy: true, // Força o uso de GPS/Wi-Fi preciso em vez de IP
                timeout: 10000,          // Tempo máximo de espera (10 segundos)
                maximumAge: 0            // Não aceita posições antigas em cache
            };

            // 2. Solicita a posição atual do usuário
            navigator.geolocation.getCurrentPosition(sucesso, erro, opcoes);

            function sucesso(posicao) {
                const lat = posicao.coords.latitude;
                const lon = posicao.coords.longitude;
                const precisao = posicao.coords.accuracy; // Precisão em metros

                status.textContent = "Localização encontrada!";
                coordenadas.innerHTML = `
                    <strong>Latitude:</strong> ${lat} <br>
                    <strong>Longitude:</strong> ${lon} <br>
                    <strong>Precisão física:</strong> dentro de ${precisao.toFixed(1)} metros
                `;
            }

            function erro(error) {
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        status.textContent = "Usuário recusou a permissão de Geolocalização.";
                        break;
                    case error.POSITION_UNAVAILABLE:
                        status.textContent = "Informações de localização indisponíveis (GPS desligado?).";
                        break;
                    case error.TIMEOUT:
                        status.textContent = "A requisição expirou antes de obter a localização.";
                        break;
                    default:
                        status.textContent = "Ocorreu um erro desconhecido.";
                        break;
                }
            }
        }
    </script>
</body>
</html>
